# US advertising self-regulation: BBB National Programs (NAD, CARU, DSSRC).
#
# These bodies are not government agencies, but they set and enforce the operative
# truth-in-advertising standards for US national advertising, and they refer
# non-compliant advertisers to the FTC or state AGs. Their case volume dwarfs federal
# enforcement: ~2,200 published decisions vs. the handful of FTC actions per year.
#
# Typed as `regulator` because schema v1 freezes source_type to [platform, regulator],
# and the UK ASA — likewise self-regulatory — is already modeled that way (asa_uk).
#
# Every quote below is verbatim from the linked primary document.

